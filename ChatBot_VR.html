}

.mode-button {
    padding: 0.5rem 1.25rem;

.mode-button.active {

}

.mode-button:hover:not(.active) {
    background-color: #4B5563;
}

.loading-overlay {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.7);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10;
    flex-direction: column;
    color: #fff;

    display: none;
}

.loading-spinner {

}

@keyframes spin {

    justify-content: center;

    position: sticky;

    background: #1F2937;
    z-index: 5;
    padding: 1rem 0;
}

.bot-visual-inner {
    width: 80px;
    height: 80px;
    background-color: #374151;

    flex-direction: column;
    justify-content: center;
    align-items: center;
    border: 4px solid #6B7280;
    position: relative;

.bot-visual-inner .eyes {
    display: flex;
    gap: 10px;
}

.bot-visual-inner .eye {
    width: 15px;
    height: 15px;
    background-color: #F9FAFB;

}

.bot-visual-inner .mouth {

    border-radius: 5px;

.bot-visual-inner.listening .mouth {

    height: 15px;

.bot-visual-inner.thinking .mouth {
    animation: thinking 1s infinite alternate;
}

.bot-visual-inner.typing .eyes {
    animation: blink 2s infinite;
}

@keyframes blink {

    0%,
    100% {

    }

    50% {
        transform: scaleY(0.1);
    }
}

@keyframes thinking {
    0% {
        transform: scaleX(0.5);
    }

    100% {
        transform: scaleX(1);
    }
}

// Function to create a message element
function createMessageElement(text, sender) {

// Function to render chat history
function renderChatHistory() {
    chatWindow.innerHTML='';
    // Add the bot visual at the top of the chat window
    chatWindow.prepend(document.getElementById('bot-visual'));
    const history=chatHistory[currentMode] || [];

    history.forEach(msg=> {

        });

// Function to save chat history to Firestore
async function saveChatHistory() {
    if ( !isAuthReady || !userId) {
        console.error("Firestore not ready or userId not available.");
        return;
    }

    try {
        const docRef=doc(db, `artifacts/$ {
                appId
            }

            /users/$ {
                userId
            }

            /chat_history`, currentMode);
        await setDoc(docRef, {
            messages: chatHistory[currentMode] || [], lastUpdated: new Date()
        }

        , {
        merge: true
    });
console.log("Chat history saved successfully.");
}

catch (e) {
    console.error("Error saving chat history: ", e);
}
}

// Function to load chat history from Firestore
async function loadChatHistory() {
    if ( !isAuthReady || !userId) {
        console.error("Firestore not ready or userId not available.");
        return;
    }

    try {
        const docRef=doc(db, `artifacts/$ {
                appId
            }

            /users/$ {
                userId
            }

            /chat_history`, currentMode);
        const docSnap=await getDoc(docRef);

        if (docSnap.exists()) {
            chatHistory[currentMode]=docSnap.data().messages;
        }

        else {
            console.log("No chat history found for this mode. Starting fresh.");
            chatHistory[currentMode]=[];

            // Add the initial welcome message for the mode
            chatHistory[currentMode].push({
                sender: 'bot',
                text: modes[currentMode].welcomeMessage
            });
    }

    renderChatHistory();
}

catch (e) {

}

// Function to call Gemini API
async function callGeminiApi(prompt) {
    let retries=0;
    const maxRetries=5;
    const baseDelay=1000;

    const sendApiRequest=async ()=> {
        try {
            const chatLog=chatHistory[currentMode].map(msg=> ({
                    role: msg.sender==='user' ? 'user' : 'model', parts: [ {
                        text: msg.text
                    }

                    ]
                }));

        const payload= {

            contents: chatLog,
            systemInstruction: {
                parts: [ {
                    text: prompt
                }

                ]
            }

            ,
            tools: [ {
                "google_search": {}
            }

            ]
        }

        ;

        const response=await fetch(GEMINI_API_URL, {

            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            }

            ,
            body: JSON.stringify(payload)
        });

    if ( !response.ok) {
        if (response.status===401) {
            throw new Error('API_KEY_ERROR');
        }

        if (response.status===429 && retries < maxRetries) {
            const delay=baseDelay * Math.pow(2, retries)+Math.random() * 100;
            retries++;

            console.warn(`API rate limit exceeded. Retrying in $ {
                    delay
                }

                ms...`);
            await new Promise(resolve=> setTimeout(resolve, delay));
            return sendApiRequest();
        }

        else {
            throw new Error(`API request failed with status $ {
                    response.status
                }

                `);
        }
    }

    const result=await response.json();
    const candidate=result.candidates?.[0];

    if (candidate && candidate.content?.parts?.[0]?.text) {
        return candidate.content.parts[0].text;
    }

    else {
        throw new Error("Invalid API response format or empty content.");
    }
}

catch (e) {
    console.error("Failed to fetch response:", e);
    throw e;
}
}

;
return sendApiRequest();
}

    botVisualInner.classList.add('thinking');

// Function to handle speech recognition
function startSpeechRecognition() {
    if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
        speechRecognition=new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        speechRecognition.continuous=false;
        speechRecognition.interimResults=false;
        speechRecognition.lang='en-US';

        speechRecognition.onstart=()=> {
            speechButton.style.backgroundColor='#EF4444'; // Red color
            botVisualInner.classList.add('listening');
            console.log('Speech recognition started...');
        }

        ;

        speechRecognition.onresult=(event)=> {
            const transcript=event.results[0][0].transcript;
            messageInput.value=transcript;
            speechButton.style.backgroundColor='#3B82F6';
            botVisualInner.classList.remove('listening');
            console.log('Transcript:', transcript);
            sendMessage(transcript);
        }

        ;

        speechRecognition.onerror=(event)=> {
            speechButton.style.backgroundColor='#3B82F6';
            botVisualInner.classList.remove('listening');

            if (event.error==='aborted') {
                console.log('Speech recognition aborted (user cancelled or timed out).');
                displayFeedbackMessage('Speech recognition was cancelled.');
            }

            else if (event.error==='no-speech') {
                console.log('Speech recognition error: no-speech. No sound was detected.');
                displayFeedbackMessage('No speech was detected. Please make sure your microphone is on and try again.');
            }

            else {
                console.error('Speech recognition error:', event.error);

                displayFeedbackMessage(`Error with speech recognition: $ {
                        event.error
                    }

                    `);
            }
        }

        ;

        speechRecognition.onend=()=> {
            speechButton.style.backgroundColor='#3B82F6';
            botVisualInner.classList.remove('listening');
            console.log('Speech recognition ended.');
        }

        ;

        speechRecognition.start();
    }

    else {
        displayFeedbackMessage('Speech recognition is not supported in this browser.');
        speechButton.disabled=true;
    }
}

    // Deactivate old button and activate new one

// Firebase authentication and initialization
async function initFirebase() {
    try {
        const app=initializeApp(firebaseConfig);
        db=getFirestore(app);
        auth=getAuth(app);

        onAuthStateChanged(auth, async (user)=> {
                if (user) {
                    userId=user.uid;
                    isAuthReady=true;
                    authContainer.style.display='none';
                    appContainer.style.display='flex';

                    document.getElementById('user-id-display').textContent=`User ID: $ {
                        userId
                    }

                    `;
                    // Initial load of the chat history for the default mode
                    updateInputButtons();
                    await loadChatHistory();
                }

                else {
                    console.log("No user is signed in.");
                    isAuthReady=true; // Still ready for anonymous sign-in
                    authContainer.style.display='none';
                    appContainer.style.display='flex';

                    if (initialAuthToken) {
                        await signInWithCustomToken(auth, initialAuthToken);
                    }

                    else {
                        await signInAnonymously(auth);
                    }
                }
            });
    }

    catch (e) {
        console.error("Error initializing Firebase:", e);
        authContainer.style.display='none';
        appContainer.style.display='flex';
        const errorMsg=document.createElement('p');
        errorMsg.className='text-red-400 mt-4';
        errorMsg.textContent='Error: Firebase could not be initialized. Check console for details.';
        authContainer.appendChild(errorMsg);
    }
